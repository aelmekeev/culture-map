<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture Map - Data Extractor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Data Extractor Tool</h1>
            <p>Upload an image, align the scale edges to the box boundaries, lock it, and measure values.</p>
        </header>

        <div class="controls panel">
            <div class="upload-section">
                <input type="file" id="image-upload" accept="image/*">
                <div style="margin-top: 0.5rem; font-size: 0.85rem; color: #94a3b8;">
                    Or press <strong>Cmd+V</strong> / <strong>Ctrl+V</strong> to paste
                </div>
            </div>
            
            <div class="zoom-controls">
                <label for="zoom">Zoom:</label>
                <input type="range" id="zoom" min="0.5" max="2" step="0.002" value="1">
            </div>

            <div class="lock-control">
                <input type="checkbox" id="lock-checkbox">
                <label for="lock-checkbox"><strong>Lock Image & Show Grid</strong></label>
            </div>
        </div>

        <div class="workspace">
            <div class="box-container" id="box-container">
                <img id="uploaded-image" src="" alt="Upload an image" style="display: none;">
                <div id="grid-overlay" class="overlay hidden">
                    <!-- Grid lines generated by JS -->
                </div>
                <div id="cursor-line" class="cursor-line hidden"></div>
            </div>
            
            <div class="measurement-controls hidden" id="measurement-controls">
                <input type="range" id="measure-slider" min="-100" max="100" step="1" value="0">
                <div class="value-display">Current Value: <span id="current-value">0</span></div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
