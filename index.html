<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Culture Map</title>
    <meta name="description" content="An interactive visualization of Erin Meyer's Culture Map scales.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="page-header">
            <h1>Culture Map</h1>
            <p>An interactive visualization of Erin Meyer's Culture Map scales.</p>
        </header>
        <div class="content-wrapper">
            <aside class="sidebar">
                <header class="sidebar-header mobile-only">
                    <h1>Controls</h1>
                </header>

            <div class="controls-section">
                <h3>View Mode</h3>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btn-absolute">Absolute</button>
                    <button class="toggle-btn" id="btn-relative">Relative</button>
                </div>

                <div id="base-country-selector" class="hidden">
                    <label for="base-country">Base Country</label>
                    <select id="base-country">
                        <!-- Options generated by JS -->
                    </select>
                </div>
            </div>

            <div class="controls-section flex-fill">
                <h3>Countries</h3>

                <label
                    style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; cursor: pointer; padding: 0.5rem; background: rgba(0,0,0,0.02); border-radius: 0.5rem; border: 1px solid var(--border-color);">
                    <input type="checkbox" id="toggle-lines" class="custom-checkbox" checked>
                    <span style="font-size: 0.875rem; color: var(--text-primary); font-weight: 500;">Show connecting
                        lines</span>
                </label>

                <div class="search-box">
                    <input type="text" id="country-search" placeholder="Search countries...">
                </div>
                <div class="country-list" id="country-list">
                    <!-- Checkboxes generated by JS -->
                </div>
                <div class="selection-actions">
                    <button id="btn-select-all" class="action-btn">Select All</button>
                    <button id="btn-clear-all" class="action-btn">Clear</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="chart-container" id="chart-container">
                <!-- SVG injected by JS -->
            </div>
        </main>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
